<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">     
    <title>portfolio-site</title>
  </head>
  <body class="flex flex-row bg-background text-text font-body min-h-screen">
    <nav id="navigation" class="flex flex-col items-center fixed left-0 top-0 h-screen w-12 gap-2 openP:w-32 openP:bg-surface open:bg-opacity-20 transition-all duration-300">
      <button id="navHamburger"> | | | </button>
      <button class="hidden openC:block openC:bg-copper openC:border-2 openC:border-surface-light openC:hover:bg-copper-light rounded-xl w-fit p-1" data-panel="0">Home</button>
      <button class="hidden openC:block openC:bg-copper openC:border-2 openC:border-surface-light openC:hover:bg-copper-light rounded-xl w-fit p-1" data-panel="1">About</button>
      <button class="hidden openC:block openC:bg-copper openC:border-2 openC:border-surface-light openC:hover:bg-copper-light rounded-xl w-fit p-1" data-panel="2">Project</button>
      <button class="hidden openC:block openC:bg-copper openC:border-2 openC:border-surface-light openC:hover:bg-copper-light rounded-xl w-fit p-1" data-panel="3">Contact</button>
    </nav>

    <main class="flex flex-col flex-1 pt-16 p-4 w-auto mx-auto">
      
      <div id="home"></div>

      <div id="about"></div>

      <div id="project"></div>

      <div id="contact"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
